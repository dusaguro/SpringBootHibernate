spring.application.name=springdatajpa
# esta configuracion tiene jdbc, el driver, la url con el puerto y el nombre de la base de datos
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/db_users_springboot
# el nombre del usuario
spring.datasource.username=root
# la contraseña
spring.datasource.password= 
# se selecciona el driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# se selecciona el dialecto
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# se inidca al framework que muestre las consultas y operaciones que hace
spring.jpa.show-sql=true
# esta configuracion crea automaticamente las tablas que no existen de acuerdo con las entidades
spring.jpa.hibernate.ddl-auto=create